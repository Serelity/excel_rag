channels:
  - conda-forge
dependencies:
  - python=3.11
  - openjdk=21
  - pip>=24,<26
  - setuptools>=75
  - wheel>=0.44

variables:
  DO_NOT_TRACK: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

# The companion creation script installs the locked Python packages. Java 21
# is isolated here because Pyserini 1.2.0 uses Lucene/Anserini through PyJNIus.
