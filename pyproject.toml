[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-rag-pipeline"
version = "0.1.0"
description = "Recoverable extraction and indexing pipeline for civic service tickets"
requires-python = ">=3.11,<3.13"
dependencies = [
  "openai==1.75.0",
  "pydantic==2.11.4",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
serve = [
  "torch==2.6.0",
  "transformers==4.51.3",
  "vllm==0.8.5",
]
index = [
  "FlagEmbedding==1.3.4",
  "qdrant-client==1.14.2",
  "torch==2.6.0",
  "transformers==4.51.3",
]
retrieval = [
  "FlagEmbedding==1.3.4",
  "modelscope==1.40.1",
  "pyserini==1.2.0",
  "torch==2.6.0",
  "transformers==4.51.3",
]
dev = [
  "jsonschema==4.23.0",
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "ruff==0.11.7",
]

[tool.setuptools]
py-modules = [
  "main",
  "index_chunks",
  "build_retrieval_dataset",
  "run_popularity_baseline",
  "run_bm25_retrieval",
  "run_bge_retrieval",
  "evaluate_retrieval",
]

[tool.setuptools.packages.find]
include = ["pipeline*", "schemas*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
