<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
<title>工单标注 · Civic RAG</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#23332f;background:#f3f5f1;font-size:15px}
*{box-sizing:border-box}body{margin:0}header{padding:22px 28px;background:#163f36;color:#fff}
h1{font-size:23px;margin:0 0 8px}h2{font-size:18px;margin:0 0 14px}h3{font-size:16px}
p{line-height:1.7}.muted{color:#61736b;font-size:13px}header p{margin:0;color:#d4e4dc}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 28px;background:#fff;border-bottom:1px solid #dbe2db}
button,select,input,textarea{font:inherit;border:1px solid #b9c7bf;border-radius:6px;padding:8px;background:#fff;color:inherit}
button{cursor:pointer}button:hover{background:#e6efe9}button:disabled{opacity:.45;cursor:default}
.primary{background:#216450;color:white}.primary:hover{background:#174b3c}
input,textarea,select{max-width:100%}textarea{width:100%;resize:vertical;min-height:65px;line-height:1.6}
label{display:block;margin:12px 0 6px}label input:not([type=checkbox]),label select{display:block;width:100%;margin-top:6px}
input[type=checkbox]{margin-right:8px}.layout{display:grid;grid-template-columns:190px minmax(260px,1fr) minmax(350px,1.2fr);gap:18px;padding:22px;max-width:1700px;margin:auto}
nav{max-height:80vh;overflow:auto}nav button{display:block;width:100%;margin-bottom:7px;text-align:left}
nav button[aria-current=true]{border:2px solid #216450;background:#e5eee8}
.panel{background:white;border:1px solid #dbe2db;border-radius:10px;padding:20px;min-width:0}
.source-panel{align-self:start;position:sticky;top:12px}.source{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;max-height:62vh;overflow:auto;border-top:1px solid #e0e6df;padding-top:14px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}details{margin-top:20px}summary{cursor:pointer;color:#216450}
.issue{background:#f7f9f6;border:1px solid #dbe2db;border-radius:8px;padding:15px;margin:12px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.issue .row>label{flex:1;min-width:150px}.quote{display:flex;align-items:start;gap:8px;margin:8px 0}.quote textarea{min-height:54px}
.error{color:#9c2b1e;background:#fff3ee;border-radius:6px;padding:10px;white-space:pre-wrap}.error:empty{display:none}
#message{margin:0 28px;padding:10px 0;white-space:pre-wrap}footer{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:1050px){.layout{grid-template-columns:140px 1fr}.source-panel{position:static;grid-column:2}.editor{grid-column:2}nav{grid-row:1 / 3}}
@media(max-width:640px){.layout{display:block;padding:12px}nav{display:flex;max-height:100px;gap:5px;margin-bottom:12px}nav button{min-width:100px}.panel{margin-bottom:12px}.toolbar{padding:12px}}
</style>
<header><h1>工单语义标注</h1><p>读原文，确定当前知识需求，保留可核对的证据。</p></header>
<div class="toolbar">
  <strong id="progress"></strong>
  <button id="import-button">导入已保存工作表</button><input id="import-file" type="file" accept=".jsonl" hidden>
  <button id="export-draft">导出草稿</button><button id="export-complete" class="primary">导出全部已确认标注</button>
  <span class="muted" id="save-state">请用导出保存进度；页面不会自动写回文件。</span>
</div>
<div id="message" role="status" aria-live="polite"></div>
<main class="layout">
  <nav id="records" aria-label="工单列表"></nav>
  <section class="panel source-panel"><h2 id="source-title"></h2><p class="muted" id="source-id"></p>
    <div id="source" class="source"></div>
    <details id="prediction-box"><summary>查看模型输出（建议完成独立判断后再查看）</summary><pre id="prediction"></pre></details>
  </section>
  <section class="panel editor"><h2>填写参考答案</h2>
    <p class="muted">同一问题的过程和反复描述合并；需要不同知识答案的问题分开。办结、挂机不自动代表问题已解决；原文不足时选“信息不足”。</p>
    <div class="row"><label>标注人<input id="annotator" maxlength="100" placeholder="填写实际审阅人"></label>
    <label>当前状态<select id="case-status"></select></label></div>
    <h3>当前待检索问题</h3><p class="muted">包括明确的撤单、咨询或跟进诉求；不受 v4 的三个问题上限约束。</p>
    <div id="active-issues"></div><button id="add-active">＋ 添加当前问题</button>
    <h3>历史背景问题</h3><p class="muted">已解决、被撤回或仅用来解释经过的问题。</p>
    <div id="background-issues"></div><button id="add-background">＋ 添加背景问题</button>
    <label for="notes">判断依据与疑问</label><textarea id="notes" maxlength="2000"></textarea>
    <p id="errors" class="error" role="alert"></p>
    <footer><button id="previous">上一条</button><button id="complete" class="primary">确认本条并继续</button><button id="next">下一条</button></footer>
  </section>
</main>
<script type="application/json" id="worksheet-data"><!-- WORKSHEET_DATA --></script>
<script>/* ANNOTATION_APP */</script>
</html>
